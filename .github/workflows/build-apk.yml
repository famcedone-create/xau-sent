name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build installable debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk XAU-SENT.apk
      - uses: actions/upload-artifact@v4
        with:
          name: XAU-SENT-APK
          path: XAU-SENT.apk
      - name: Publish/update easy download release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest
          git push origin -f latest
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest XAU-SENT.apk --clobber
          else
            gh release create latest XAU-SENT.apk --title "XAU SENT - ultima versione" --notes "APK Android installabile."
          fi
